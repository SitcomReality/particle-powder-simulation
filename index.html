<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Particle Powder Simulation</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <canvas id="canvas"></canvas>
    
    <div id="controls">
      <div class="control-group">
        <label>
          Grid Size: <span id="gridSizeValue">8</span>
          <input type="range" id="gridSize" min="4" max="32" value="8" step="4">
        </label>
      </div>

      <div class="control-group">
        <label>
          Simulation Speed: <span id="simSpeedValue">1.0</span>x
          <input type="range" id="simSpeed" min="0.1" max="2" value="1" step="0.1">
        </label>
      </div>

      <div class="control-group">
        <button id="loadImage">Load Image</button>
        <input type="file" id="imageInput" accept="image/*" style="display: none;">
        <button id="clear">Clear</button>
        <button id="pause">Pause</button>
      </div>

      <div class="control-group">
        <h3>Presets</h3>
        <select id="presetSelect"></select>
        <button id="loadPreset">Load</button>
        <button id="randomizePreset">Randomize</button>
      </div>

      <div class="control-group">
        <input type="text" id="presetName" placeholder="Preset name">
        <button id="savePreset">Save Current</button>
        <button id="deletePreset">Delete</button>
      </div>

      <div class="control-group">
        <button id="toggleColorMap">Toggle Color Map</button>
      </div>
    </div>

    <div id="colorMapPanel" style="display: none;">
      <h3>Color Property Mapping</h3>
      <div id="colorMapContent"></div>
    </div>
  </div>

  <script type="module" src="main.js"></script>
<script defer src="https://static.cloudflareinsights.com/beacon.min.js/v8c78df7c7c0f484497ecbca7046644da1771523124516" integrity="sha512-8DS7rgIrAmghBFwoOTujcf6D9rXvH8xm8JQ1Ja01h9QX8EzXldiszufYa4IFfKdLUKTTrnSFXLDkUEOTrZQ8Qg==" data-cf-beacon='{"version":"2024.11.0","token":"4c6229722a6346bc8eb5cb0e5eae5d41","server_timing":{"name":{"cfCacheStatus":true,"cfEdge":true,"cfExtPri":true,"cfL4":true,"cfOrigin":true,"cfSpeedBrain":true},"location_startswith":null}}' crossorigin="anonymous"></script>
</body>
</html>
