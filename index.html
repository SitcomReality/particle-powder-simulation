<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Particle Powder Simulation</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <div id="mainLayout">
      <div id="canvasContainer">
        <div id="fpsCounter">FPS: 0</div>
        <canvas id="canvas"></canvas>
      </div>

      <div id="sidebar">
        <div id="controls">
          <div class="control-group">
            <label>
              Simulation Speed: <span id="simSpeedValue">1.0</span>x
              <input type="range" id="simSpeed" min="0.1" max="2" value="1" step="0.1">
            </label>
            <button id="pause" style="margin-left:8px;">Pause</button>
          </div>

          <div class="control-group">
            <div style="display:flex; gap:8px; align-items:center;">
              <button id="loadImage">Upload Image</button>
              <button id="clear">Clear</button>
              <input type="file" id="imageInput" accept="image/*" style="display: none;">
            </div>

            <div style="margin-top:6px; display:flex; flex-wrap:wrap; gap:4px;">
              <button id="loadQuadRose" style="flex:1 1 48%;">Rose</button>
              <button id="loadQuadCyberpunk" style="flex:1 1 48%;">Cyberpunk</button>
              <button id="loadQuadDesert" style="flex:1 1 48%;">Desert</button>
              <button id="loadQuadGeometry" style="flex:1 1 48%;">Geometry</button>
            </div>
          </div>

          <div class="control-group">
            <h3>Presets</h3>
            <select id="presetSelect"></select>
            <button id="loadPreset">Load</button>
            <button id="randomizePreset">Randomize</button>
          </div>

          <div class="control-group">
            <input type="text" id="presetName" placeholder="Preset name">
            <button id="savePreset">Save Current</button>
            <button id="deletePreset">Delete</button>
          </div>

          <div class="control-group">
            <button id="toggleColorMap">Toggle Color Map</button>
          </div>
        </div>
      </div>
    </div>

    <div id="drawingControls">
      <div class="drawing-group">
        <h3>Drawing</h3>
        <label>
          Tool
          <select id="toolSelect">
            <option value="brush">Brush</option>
            <option value="line">Line</option>
            <option value="rect">Rectangle</option>
          </select>
        </label>

        <label>
          Brush / Line Width: <span id="brushSizeValue">4</span>
          <input type="range" id="brushSize" min="1" max="32" value="4" step="1">
        </label>

        <div class="color-section">
          <div class="color-row">
            <span class="color-label">Color</span>
            <div style="display:flex; gap:6px; align-items:center;">
              <input type="color" id="colorPicker" value="#ffcc00">
              <button id="eyedropBrush" title="Pick color from canvas" style="padding:6px;">🎯</button>
            </div>
          </div>
          <div id="colorPalette" class="color-palette">
            <button class="color-swatch-btn" data-color="#ff4b4b" style="background:#ff4b4b;"></button>
            <button class="color-swatch-btn" data-color="#ffb74b" style="background:#ffb74b;"></button>
            <button class="color-swatch-btn" data-color="#ffe54b" style="background:#ffe54b;"></button>
            <button class="color-swatch-btn" data-color="#4bff85" style="background:#4bff85;"></button>
            <button class="color-swatch-btn" data-color="#4be0ff" style="background:#4be0ff;"></button>
            <button class="color-swatch-btn" data-color="#4b6bff" style="background:#4b6bff;"></button>
            <button class="color-swatch-btn" data-color="#d84bff" style="background:#d84bff;"></button>
            <button class="color-swatch-btn" data-color="#f5f5f5" style="background:#f5f5f5;"></button>
            <button class="color-swatch-btn" data-color="#888888" style="background:#888888;"></button>
            <button class="color-swatch-btn" data-color="#111111" style="background:#111111;"></button>
          </div>
        </div>
      </div>

      <div class="drawing-group">
        <h3>Rectangle</h3>
        <div class="color-row">
          <span class="color-label">Fill</span>
          <div style="display:flex; gap:6px; align-items:center;">
            <input type="color" id="rectFillColor" value="#ffcc00">
            <button id="eyedropRectFill" title="Pick fill color from canvas" style="padding:6px;">🎯</button>
            <label style="margin-left:6px; font-size:11px;">
              <input type="checkbox" id="rectFillEnabled" checked> Fill
            </label>
          </div>
        </div>
        <div class="color-row">
          <span class="color-label">Outline</span>
          <div style="display:flex; gap:6px; align-items:center;">
            <input type="color" id="rectStrokeColor" value="#111111">
            <button id="eyedropRectStroke" title="Pick outline color from canvas" style="padding:6px;">🎯</button>
            <label style="margin-left:6px; font-size:11px;">
              <input type="checkbox" id="rectStrokeEnabled" checked> Outline
            </label>
          </div>
        </div>
        <label>
          Outline Width: <span id="outlineWidthValue">2</span>
          <input type="range" id="outlineWidth" min="1" max="32" value="2" step="1">
        </label>
      </div>
    </div>

    <div id="colorMapPanel" style="display: none;">
      <h3>Color Property Mapping</h3>
      <div id="colorMapContent"></div>
    </div>
  </div>

  <script type="module" src="main.js"></script>

</body>
</html>
